<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
  <!-- Kofa, the Sankofa bird: body faces right, head turned back, egg in beak -->
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC933"/>
      <stop offset="1" stop-color="#F29A0E"/>
    </linearGradient>
    <linearGradient id="headG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD24D"/>
      <stop offset="1" stop-color="#F7AE1C"/>
    </linearGradient>
    <clipPath id="scarfClip">
      <path d="M182 205 Q250 238 318 200 L326 236 Q250 278 176 240 Z"/>
    </clipPath>
  </defs>

  <!-- tail feathers (kente colours) -->
  <g stroke="#1B1B1B" stroke-width="7" stroke-linejoin="round">
    <path d="M110 250 Q30 170 52 120 Q95 150 128 222 Z" fill="#0F7A3E"/>
    <path d="M100 268 Q10 240 8 190 Q70 195 120 250 Z" fill="#D7263D"/>
    <path d="M108 290 Q30 300 18 262 Q72 248 122 270 Z" fill="#1B1B1B"/>
  </g>

  <!-- legs -->
  <g stroke="#1B1B1B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M190 345 L186 392 M186 392 L214 392 M186 392 L206 404" stroke="#E0631A" stroke-width="10"/>
    <path d="M245 342 L246 390 M246 390 L274 390 M246 390 L266 402" stroke="#E0631A" stroke-width="10"/>
  </g>

  <!-- body -->
  <ellipse cx="215" cy="268" rx="128" ry="95" fill="url(#bodyG)" stroke="#1B1B1B" stroke-width="7"/>
  <!-- belly -->
  <path d="M260 220 Q340 250 318 318 Q290 352 238 352 Q300 300 260 220 Z" fill="#FFE6A3" opacity="0.9"/>
  <!-- wing -->
  <path d="M130 250 Q190 205 252 240 Q250 300 180 318 Q140 312 130 250 Z" fill="#E8890C" stroke="#1B1B1B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M160 262 Q195 250 228 262 M162 284 Q192 276 220 286" stroke="#B85F06" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M215 205 Q250 175 300 190 L312 238 Q262 262 205 236 Z" fill="url(#headG)" stroke="#1B1B1B" stroke-width="7" stroke-linejoin="round"/>

  <!-- kente scarf -->
  <g clip-path="url(#scarfClip)">
    <rect x="150" y="180" width="200" height="120" fill="#0F7A3E"/>
    <rect x="190" y="180" width="18" height="120" fill="#FFC933"/>
    <rect x="208" y="180" width="10" height="120" fill="#D7263D"/>
    <rect x="236" y="180" width="18" height="120" fill="#FFC933"/>
    <rect x="254" y="180" width="10" height="120" fill="#1B1B1B"/>
    <rect x="282" y="180" width="18" height="120" fill="#FFC933"/>
    <rect x="300" y="180" width="10" height="120" fill="#D7263D"/>
  </g>
  <path d="M182 205 Q250 238 318 200 L326 236 Q250 278 176 240 Z" fill="none" stroke="#1B1B1B" stroke-width="7" stroke-linejoin="round"/>
  <!-- scarf tail -->
  <path d="M300 232 L330 300 L306 296 L292 240 Z" fill="#0F7A3E" stroke="#1B1B1B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M304 250 L318 282" stroke="#FFC933" stroke-width="7"/>

  <!-- head (turned back, looking at viewer) -->
  <circle cx="262" cy="128" r="84" fill="url(#headG)" stroke="#1B1B1B" stroke-width="7"/>
  <!-- crest -->
  <path d="M250 46 Q240 10 268 18 Q262 34 270 46 Q282 12 306 26 Q288 40 286 54" fill="#D7263D" stroke="#1B1B1B" stroke-width="6" stroke-linejoin="round"/>

  <!-- beak pointing backward (left), slightly open -->
  <path d="M196 120 L128 132 L194 148 Z" fill="#F26B1D" stroke="#1B1B1B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M196 150 L140 152 L198 170 Z" fill="#E0631A" stroke="#1B1B1B" stroke-width="6" stroke-linejoin="round"/>
  <!-- golden egg in beak -->
  <ellipse cx="128" cy="144" rx="20" ry="25" transform="rotate(-20 128 144)" fill="#FFF4D6" stroke="#1B1B1B" stroke-width="6"/>
  <path d="M118 134 Q122 128 128 128" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="236" cy="112" rx="25" ry="30" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="6"/>
  <ellipse cx="292" cy="110" rx="25" ry="30" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="6"/>
  <circle cx="242" cy="118" r="13" fill="#1B1B1B"/>
  <circle cx="298" cy="116" r="13" fill="#1B1B1B"/>
  <circle cx="247" cy="112" r="5" fill="#FFFFFF"/>
  <circle cx="303" cy="110" r="5" fill="#FFFFFF"/>
  <!-- eyebrows: one raised (curious / mischievous) -->
  <path d="M212 76 Q234 62 258 72" stroke="#1B1B1B" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M272 80 Q292 76 314 84" stroke="#1B1B1B" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="318" cy="150" rx="14" ry="9" fill="#F26B1D" opacity="0.45"/>
  <ellipse cx="214" cy="160" rx="10" ry="7" fill="#F26B1D" opacity="0.35"/>
</svg>
