<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:800px;height:800px;background:#0B5D30;overflow:hidden}
.bg{position:absolute;inset:0;background:
  radial-gradient(circle at 50% 45%, #13874A 0%, #0B5D30 62%, #073F20 100%)}
/* kente ring visible inside YouTube's circle crop */
.ring{position:absolute;left:22px;top:22px;width:756px;height:756px;border-radius:50%;
  background:repeating-conic-gradient(#FFC933 0 6deg,#D7263D 6deg 9deg,#FFC933 9deg 15deg,#1B1B1B 15deg 18deg);
  -webkit-mask:radial-gradient(circle, transparent 352px, #000 353px);mask:radial-gradient(circle, transparent 352px, #000 353px)}
.sun{position:absolute;left:150px;top:120px;width:500px;height:500px;border-radius:50%;background:#FFE6A3;opacity:.16}
.m{position:absolute;left:95px;top:95px;width:610px;height:640px}
.m svg{width:100%;height:100%}
</style></head><body>
<div class="bg"></div><div class="sun"></div><div class="ring"></div>
<div class="m">{{MASCOT}}</div>
</body></html>
